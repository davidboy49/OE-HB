services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auditdesk
      POSTGRES_PASSWORD: auditdesk
      POSTGRES_DB: auditdesk
    ports:
      - "5432:5432"
    volumes:
      - auditdesk-postgres-data:/var/lib/postgresql/data

volumes:
  auditdesk-postgres-data:
